packages:
  - '.'
overrides:
  # Legacy Microbundle tooling still requests the vulnerable serializer 4.x.
  'rollup-plugin-terser@7.0.2>serialize-javascript': '7.1.3'
  # RSS and sitemap retain older Zod releases than Astro itself.
  'zod@>=4.0.0 <4.6.6': '4.6.7'
  # Astro's font loader still resolves the vulnerable Undici 8.x release.
  'undici@>=8.0.0 <8.12.2': '8.12.2'
  # PostCSS pins source-map-js 1.2.1 instead of accepting patch updates.
  'source-map-js@<1.2.2': '^1.2.2'
  # Older CSS tooling still pins vulnerable selector-parser 6.x releases.
  'postcss-selector-parser@<7.1.6': '^7.1.6'
  # Match Markdown's transitive renderer to the patched KaTeX used for its assets.
  'katex@<0.18.2': '^0.19.0'
allowBuilds:
  esbuild: true
  workerd: true
patchedDependencies:
  # GHSA-gcqx-w48m-w2h4: guard source and target keys until an upstream fix ships.
  deepmerge@4.3.1: patches/deepmerge@4.3.1.patch
